# Renders the plugin's windows as pictures, without Revit.
#
# Runs when a pull request touches the interface (or on demand). The UI
# preview tests build every window in the states a user can meet and save
# each one as a PNG. The pictures go to two places:
#
#   - the run's "ui-previews" artifact
#   - the "ui-previews" branch (one commit, replaced on every run), so they
#     can be opened straight from GitHub
#
# The ui-previews branch holds only generated pictures. Nothing is ever
# merged from it and it can be deleted at any time.
name: UI preview

on:
  pull_request:
    paths:
      - "src/RevitCortex.Plugin/UI/**"
      - "src/RevitCortex.Plugin/PowerBi/**"
      - "src/RevitCortex.Tests/UiPreview/**"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

# Needed to push the pictures to the ui-previews branch. A pull request from
# a fork gets a read-only token regardless, so there the push step is skipped.
permissions:
  contents: write

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # TEMPORARY (diagnosis): the whole suite, results kept with the pictures.
      - name: Run the unit tests and keep the results
        continue-on-error: true
        shell: pwsh
        run: >
          dotnet test src/RevitCortex.Tests/RevitCortex.Tests.csproj -c "Debug R25" --nologo
          --logger "trx;LogFileName=unit-tests.trx" --results-directory "${{ runner.temp }}\ui-previews"

      - name: Render every window
        shell: pwsh
        env:
          UI_PREVIEW_DIR: ${{ runner.temp }}\ui-previews
          UI_PREVIEW_LANG: es
        run: >
          dotnet test src/RevitCortex.Tests/RevitCortex.Tests.csproj -c "Debug R25" --nologo
          --filter "FullyQualifiedName~UiPreviewTests"

      # Also when a window failed: the pictures of the others are still useful.
      - name: Keep the pictures with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: ${{ runner.temp }}\ui-previews
          retention-days: 14
          if-no-files-found: warn

      - name: Publish the pictures to the ui-previews branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DIR: ${{ runner.temp }}\ui-previews
        run: |
          if (-not (Test-Path "$env:PREVIEW_DIR\*")) { Write-Host "Nothing was rendered."; exit 0 }

          $note = "Generated by the UI preview workflow from commit $env:GITHUB_SHA ($env:GITHUB_REF_NAME).`n" +
                  "These pictures are rendered without Revit, in Spanish. Do not edit: the branch is replaced on every run.`n"
          Set-Content "$env:PREVIEW_DIR\README.md" $note -NoNewline

          git -C $env:PREVIEW_DIR init -q -b ui-previews
          git -C $env:PREVIEW_DIR config user.name "github-actions[bot]"
          git -C $env:PREVIEW_DIR config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C $env:PREVIEW_DIR add -A
          git -C $env:PREVIEW_DIR commit -q -m "UI previews for $env:GITHUB_SHA"
          git -C $env:PREVIEW_DIR push -q -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" ui-previews
          if ($LASTEXITCODE -ne 0) { throw "Could not push the pictures to the ui-previews branch." }
